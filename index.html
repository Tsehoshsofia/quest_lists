<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мастер списков Python</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --good: #22c55e;
    --bad: #ef4444;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }

  .game {
    width: 100%;
    max-width: 860px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .badge {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px;
    color: var(--muted);
  }

  .card {
    background: var(--card);
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 26px;
    box-shadow: 0 18px 40px rgba(0,0,0,.25);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 30px;
    line-height: 1.2;
  }

  h2 {
    margin: 0 0 10px;
    font-size: 22px;
  }

  p {
    line-height: 1.6;
    color: var(--text);
  }

  .muted {
    color: var(--muted);
    font-size: 15px;
  }

  .code {
    display: block;
    background: #0b1120;
    border: 1px solid #334155;
    color: #7dd3fc;
    padding: 14px 16px;
    border-radius: 12px;
    font-family: Consolas, Monaco, monospace;
    font-size: 15px;
    white-space: pre-wrap;
    margin: 16px 0;
  }

  .list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0 20px;
  }

  .item {
    background: #0b1120;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 8px 12px;
    font-family: Consolas, Monaco, monospace;
    font-size: 14px;
  }

  .item span {
    color: var(--muted);
    font-size: 12px;
    margin-right: 6px;
  }

  .answers {
    display: grid;
    gap: 10px;
    margin-top: 18px;
  }

  button {
    width: 100%;
    text-align: left;
    background: #0b1120;
    border: 1px solid #334155;
    color: var(--text);
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 15px;
    font-family: Consolas, Monaco, monospace;
    cursor: pointer;
    transition: .15s ease;
  }

  button:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  button.correct {
    border-color: var(--good);
    background: rgba(34,197,94,.12);
  }

  button.wrong {
    border-color: var(--bad);
    background: rgba(239,68,68,.10);
  }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    display: none;
    line-height: 1.55;
  }

  .feedback.show { display: block; }
  .feedback.ok { background: rgba(34,197,94,.12); border: 1px solid var(--good); }
  .feedback.err { background: rgba(239,68,68,.10); border: 1px solid var(--bad); }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .btn {
    width: auto;
    text-align: center;
    font-family: inherit;
    background: var(--accent);
    border: none;
    color: #04283d;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 10px;
    cursor: pointer;
  }

  .btn.secondary {
    background: transparent;
    border: 1px solid #475569;
    color: var(--text);
  }

  input {
    width: 100%;
    background: #0b1120;
    border: 1px solid #334155;
    color: var(--text);
    padding: 13px 14px;
    border-radius: 10px;
    font-family: Consolas, Monaco, monospace;
    font-size: 15px;
    margin-top: 10px;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .progress {
    height: 8px;
    background: #0b1120;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }

  .progress div {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
    transition: width .4s ease;
  }

  .hidden { display: none; }

  .final {
    text-align: center;
  }

  .final h1 {
    font-size: 34px;
  }

  .score {
    font-size: 40px;
    font-weight: 800;
    color: var(--accent);
    margin: 12px 0;
  }

  @media (max-width: 600px) {
    .card { padding: 18px; }
    h1 { font-size: 24px; }
    .code { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="game">
  <div class="topbar">
    <div class="badge">🐍 Мастер списков Python</div>
    <div class="badge" id="scoreBadge">Очки: 0</div>
  </div>

  <div class="progress"><div id="progressBar"></div></div>

  <div class="card" id="app"></div>
</div>

<script>
const app = document.getElementById("app");
const scoreBadge = document.getElementById("scoreBadge");
const progressBar = document.getElementById("progressBar");

let score = 0;
let step = 0;
const totalSteps = 11;

const steps = [
  {
    title: "История 1. Покупка автомобиля",
    text: "Вы пришли в автосалон. В гараже уже есть несколько машин, и вы решили купить <b>Aurus Senat</b>.",
    code: "garage = ['Lada Granta', 'Niva Travel', 'Lada Vesta', 'УАЗ Патриот']",
    list: ["Lada Granta", "Niva Travel", "Lada Vesta", "УАЗ Патриот"],
    question: "Как добавить <b>'Aurus Senat'</b> в конец списка <code>garage</code>?",
    options: [
      { text: "garage.add('Aurus Senat')", correct: false, explain: "У списков Python нет метода add(). Для добавления одного элемента в конец используется append()." },
      { text: "garage.append('Aurus Senat')", correct: true, explain: "Верно! append() добавляет элемент в самый конец списка." },
      { text: "garage.insert('Aurus Senat')", correct: false, explain: "insert() требует два аргумента: индекс и значение. Например: garage.insert(0, 'Aurus Senat')." }
    ],
    result: ["Lada Granta", "Niva Travel", "Lada Vesta", "УАЗ Патриот", "Aurus Senat"]
  },
  {
    title: "История 2. Отмена заказа",
    text: "В личном кабинете салона отображаются оформленные автомобили. Вы передумали покупать <b>'УАЗ Патриот'</b> и хотите удалить именно его.",
    code: "my_cars = ['Lada Vesta', 'УАЗ Патриот', 'Aurus Senat']",
    list: ["Lada Vesta", "УАЗ Патриот", "Aurus Senat"],
    question: "Как удалить <b>'УАЗ Патриот'</b>, зная его точное название?",
    options: [
      { text: "del my_cars[1]", correct: true, explain: "Верно! del удаляет элемент по индексу. Но здесь вы также могли использовать remove()." },
      { text: "my_cars.remove('УАЗ Патриот')", correct: true, explain: "Верно! remove() удаляет первый элемент, значение которого совпадает с указанным." },
      { text: "my_cars.clear()", correct: false, explain: "clear() удаляет все элементы списка, а не только один автомобиль." }
    ],
    result: ["Lada Vesta", "Aurus Senat"]
  },
  {
    title: "История 3. VIP-клиент салона",
    text: "Вы администратор салона красоты. Клиентка <b>Елена</b> пришла без записи, но является VIP-гостем. Её нужно поставить третьей по счёту — на индекс <code>2</code>.",
    code: "appointments = ['Анна', 'Петр', 'Мария', 'Олег']",
    list: ["Анна", "Петр", "Мария", "Олег"],
    question: "Какой код вставит <b>'Елена'</b> на индекс 2, не удаляя других клиентов?",
    options: [
      { text: "appointments.append('Елена')", correct: false, explain: "append() добавит Елену в конец списка, а не на нужную позицию." },
      { text: "appointments.insert(2, 'Елена')", correct: true, explain: "Верно! insert(2, 'Елена') вставит элемент на индекс 2, а остальные сдвинутся вправо." },
      { text: "appointments[2] = 'Елена'", correct: false, explain: "Эта запись заменит Марию на Елену. Клиентка Мария исчезнет из списка." }
    ],
    result: ["Анна", "Петр", "Елена", "Мария", "Олег"]
  },
  {
    title: "История 4. Поиск клиента",
    text: "Перед звонком клиенту нужно убедиться, что <b>'Павел'</b> действительно есть в базе.",
    code: "clients = ['Павел', 'Петр', 'Анна']",
    list: ["Павел", "Петр", "Анна"],
    question: "Как правильно проверить, есть ли <b>'Павел'</b> в списке?",
    options: [
      { text: "if 'Павел' == clients:", correct: false, explain: "Оператор == сравнивает всю строку со всем списком. Это всегда даст False." },
      { text: "if 'Павел' in clients:", correct: true, explain: "Верно! Оператор in проверяет, содержится ли элемент в списке." },
      { text: "if clients.find('Павел'):", correct: false, explain: "У списков нет метода find(). Он используется для строк." }
    ],
    result: ["Павел", "Петр", "Анна"]
  },
  {
    title: "История 5. Проверка склада",
    text: "Вы хотите заказать пылесос на Ozon. Прежде чем добавить его в корзину, нужно проверить наличие товара.",
    code: "stock = ['Смартфон', 'Наушники', 'Пылесос', 'Чехол']",
    list: ["Смартфон", "Наушники", "Пылесос", "Чехол"],
    question: "Как проверить, что <b>'Пылесос'</b> есть в списке <code>stock</code>?",
    options: [
      { text: "if 'Пылесос' == stock:", correct: false, explain: "Здесь сравнивается строка и весь список. Для поиска элемента нужен оператор in." },
      { text: "if 'Пылесос' in stock:", correct: true, explain: "Верно! Выражение 'Пылесос' in stock вернёт True, потому что товар есть на складе." },
      { text: "if stock.find('Пылесос'):", correct: false, explain: "Метод find() работает со строками, но не со списками." }
    ],
    result: ["Смартфон", "Наушники", "Пылесос", "Чехол"]
  },
  {
    title: "История 6. Пополнение корзины",
    text: "Вы уже выбрали несколько товаров и нашли интересную книгу. Её нужно добавить в самый конец корзины.",
    code: "cart = ['Смартфон', 'Наушники', 'Чехол']",
    list: ["Смартфон", "Наушники", "Чехол"],
    question: "Как добавить <b>'Книга'</b> в конец списка <code>cart</code>?",
    options: [
      { text: "cart.insert('Книга')", correct: false, explain: "insert() требует два аргумента: сначала индекс, затем значение." },
      { text: "cart.append('Книга')", correct: true, explain: "Верно! append() добавляет элемент в конец списка." },
      { text: "cart.add('Книга')", correct: false, explain: "У списков Python нет метода add()." }
    ],
    result: ["Смартфон", "Наушники", "Чехол", "Книга"]
  },
  {
    title: "История 7. Удаление товара",
    text: "Вы передумали покупать наушники. Они находятся на индексе <code>1</code>.",
    code: "cart = ['Смартфон', 'Наушники', 'Чехол', 'Книга']",
    list: ["Смартфон", "Наушники", "Чехол", "Книга"],
    question: "Как удалить <b>'Наушники'</b> по индексу?",
    options: [
      { text: "del cart[1]", correct: true, explain: "Верно! del cart[1] удаляет элемент с индексом 1." },
      { text: "cart.remove(1)", correct: false, explain: "remove() ищет элемент по значению. Он попытается найти число 1, а не элемент с индексом 1." },
      { text: "cart.pop()", correct: false, explain: "pop() без аргумента удаляет последний элемент — в данном случае 'Книгу'." }
    ],
    result: ["Смартфон", "Чехол", "Книга"]
  },
  {
    title: "История 8. Очистка корзины",
    text: "Вы решили не покупать ничего сегодня и хотите полностью очистить корзину, но сохранить саму переменную <code>cart</code>.",
    code: "cart = ['Смартфон', 'Чехол', 'Книга']",
    list: ["Смартфон", "Чехол", "Книга"],
    question: "Какой код очистит корзину?",
    options: [
      { text: "cart.clear()", correct: true, explain: "Верно! clear() удаляет все элементы, но переменная cart останется пустым списком: []." },
      { text: "del cart", correct: false, explain: "del cart удалит саму переменную. После этого обращаться к cart будет нельзя." },
      { text: "cart.remove_all()", correct: false, explain: "Такого метода у списков Python нет." }
    ],
    result: []
  },
  {
    title: "История 9. Запись к врачу",
    text: "Вы записываетесь к врачу. Нужно добавить приём к <b>'Хирургу'</b> на вторник, то есть на индекс <code>1</code>.",
    code: "appointments = ['Терапевт (пн)', 'Стоматолог (ср)', 'Окулист (пт)']",
    list: ["Терапевт (пн)", "Стоматолог (ср)", "Окулист (пт)"],
    question: "Как добавить <b>'Хирург'</b> на индекс 1?",
    options: [
      { text: "appointments.append('Хирург')", correct: false, explain: "append() поставит хирурга в конец расписания, после пятницы." },
      { text: "appointments.insert(1, 'Хирург')", correct: true, explain: "Верно! insert(1, 'Хирург') вставит запись на второе место, а остальные сдвинутся." },
      { text: "appointments[1] = 'Хирург'", correct: false, explain: "Эта запись заменит стоматолога на хирурга, а не добавит новую запись." }
    ],
    result: ["Терапевт (пн)", "Хирург", "Стоматолог (ср)", "Окулист (пт)"]
  },
  {
    title: "История 10. Перенос тренировки",
    text: "Вместо бассейна в среду вы решили ходить на бокс. Нужно заменить тренировку, не добавляя новую.",
    code: "schedule = ['Йога (пн)', 'Бассейн (ср)', 'Кроссфит (пт)']",
    list: ["Йога (пн)", "Бассейн (ср)", "Кроссфит (пт)"],
    question: "Как заменить <b>'Бассейн (ср)'</b> на <b>'Бокс'</b>?",
    options: [
      { text: "schedule.append('Бокс')", correct: false, explain: "append() добавит новый элемент в конец, а бассейн останется в расписании." },
      { text: "schedule[1] = 'Бокс'", correct: true, explain: "Верно! Списки изменяемы: обращение по индексу заменяет старое значение новым." },
      { text: "schedule.insert(1, 'Бокс')", correct: false, explain: "insert() добавит бокс перед бассейном, но не заменит его." }
    ],
    result: ["Йога (пн)", "Бокс", "Кроссфит (пт)"]
  },
  {
    title: "История 11. Надёжный пароль",
    text: "Вы регистрируетесь в личном кабинете клиники. Пароль должен содержать символ <b>@</b> и заглавную букву <b>S</b>.<br><br>Введите пароль и нажмите «Проверить».",
    input: true,
    placeholder: "Например: Secure@2026",
    check: value => {
      if (!value) return { ok: false, message: "Введите пароль." };
      const hasAt = value.includes("@");
      const hasS = value.includes("S");
      if (hasAt && hasS) return { ok: true, message: "Отличный пароль! В нём есть и @, и заглавная S. В Python это выглядело бы так: '@' in password and 'S' in password." };
      let message = "Пароль не прошёл проверку. ";
      if (!hasAt) message += "В нём нет символа @. ";
      if (!hasS) message += "В нём нет заглавной буквы S. ";
      message += "Попробуйте снова.";
      return { ok: false, message };
    }
  }
];

function render() {
  const s = steps[step];
  progressBar.style.width = (step / totalSteps * 100) + "%";
  scoreBadge.textContent = "Очки: " + score;

  if (!s) return showFinal();

  let html = `
    <h1>${s.title}</h1>
    <p>${s.text}</p>
  `;

  if (s.code) {
    html += `<div class="code">${s.code}</div>`;
  }

  if (s.list) {
    html += `<div class="list">` + s.list.map((x, i) =>
      `<div class="item"><span>${i}</span>${x}</div>`
    ).join("") + `</div>`;
  }

  if (s.question) {
    html += `<p><b>Задание:</b> ${s.question}</p>
      <div class="answers">` +
      s.options.map((o, i) =>
        `<button data-i="${i}">${o.text}</button>`
      ).join("") +
      `</div>
      <div class="feedback" id="feedback"></div>
      <div class="actions hidden" id="actions">
        <button class="btn" id="next">Продолжить →</button>
      </div>`;
  }

  if (s.input) {
    html += `
      <input id="password" type="text" placeholder="${s.placeholder}" autocomplete="off">
      <div class="actions">
        <button class="btn" id="check">Проверить пароль</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions hidden" id="actions">
        <button class="btn" id="next">Перейти к финалу →</button>
      </div>`;
  }

  app.innerHTML = html;

  if (s.options) {
    app.querySelectorAll("button[data-i]").forEach(button => {
      button.addEventListener("click", () => answer(Number(button.dataset.i)));
    });
  }

  if (s.input) {
    const input = document.getElementById("password");
    const feedback = document.getElementById("feedback");
    const actions = document.getElementById("actions");

    document.getElementById("check").addEventListener("click", () => {
      const result = s.check(input.value.trim());
      feedback.className = "feedback show " + (result.ok ? "ok" : "err");
      feedback.innerHTML = (result.ok ? "✅ " : "❌ ") + result.message;

      if (result.ok) {
        score += 10;
        scoreBadge.textContent = "Очки: " + score;
        actions.classList.remove("hidden");
        document.getElementById("next").addEventListener("click", () => {
          step++;
          render();
        });
      }
    });

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("check").click();
    });
  }
}

function answer(index) {
  const s = steps[step];
  const option = s.options[index];
  const feedback = document.getElementById("feedback");
  const actions = document.getElementById("actions");

  app.querySelectorAll("button[data-i]").forEach((button, i) => {
    button.disabled = true;
    if (s.options[i].correct) button.classList.add("correct");
    if (i === index && !option.correct) button.classList.add("wrong");
  });

  if (option.correct) {
    score += 10;
    scoreBadge.textContent = "Очки: " + score;
    feedback.className = "feedback show ok";
    feedback.innerHTML = "✅ " + option.explain;
    actions.classList.remove("hidden");
    document.getElementById("next").addEventListener("click", () => {
      step++;
      render();
    });
  } else {
    feedback.className = "feedback show err";
    feedback.innerHTML = "❌ " + option.explain;
    actions.classList.remove("hidden");
    const retry = document.createElement("button");
    retry.className = "btn secondary";
    retry.textContent = "Попробовать снова";
    retry.addEventListener("click", render);
    actions.appendChild(retry);
  }
}

function showFinal() {
  progressBar.style.width = "100%";
  const percent = Math.round(score / (totalSteps * 10) * 100);

  app.innerHTML = `
    <div class="final">
      <h1>🎉 Квест пройден!</h1>
      <div class="score">${score} / ${totalSteps * 10}</div>
      <p>Вы освоили основные приёмы работы со списками Python:</p>
      <div class="code">
append() — добавить в конец  
insert(index, value) — вставить на позицию  
remove(value) — удалить по значению  
del list[index] — удалить по индексу  
pop() — удалить и вернуть последний элемент  
clear() — очистить список  
in — проверить наличие элемента  
list[index] = value — заменить элемент
      </div>
      <p class="muted">Ваш результат: ${percent}% правильных ответов.</p>
      <div class="actions" style="justify-content:center">
        <button class="btn" onclick="restart()">Пройти квест снова</button>
      </div>
    </div>`;
}

function restart() {
  score = 0;
  step = 0;
  render();
}

render();
</script>

</body>
</html>
