<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мастер списков Python</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --good: #22c55e;
    --bad: #ef4444;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }

  .game { width: 100%; max-width: 860px; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .badge {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px;
    color: var(--muted);
  }

  .card {
    background: var(--card);
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 26px;
    box-shadow: 0 18px 40px rgba(0,0,0,.25);
  }

  h1 { margin: 0 0 8px; font-size: 30px; line-height: 1.2; }
  h2 { margin: 0 0 10px; font-size: 22px; }
  p { line-height: 1.6; color: var(--text); }
  .muted { color: var(--muted); font-size: 15px; }

  .code {
    display: block;
    background: #0b1120;
    border: 1px solid #334155;
    color: #7dd3fc;
    padding: 14px 16px;
    border-radius: 12px;
    font-family: Consolas, Monaco, monospace;
    font-size: 15px;
    white-space: pre-wrap;
    margin: 16px 0;
  }

  .list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0 20px;
  }

  .item {
    background: #0b1120;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 8px 12px;
    font-family: Consolas, Monaco, monospace;
    font-size: 14px;
  }

  .item span {
    color: var(--muted);
    font-size: 12px;
    margin-right: 6px;
  }

  .answers { display: grid; gap: 10px; margin-top: 18px; }

  button {
    width: 100%;
    text-align: left;
    background: #0b1120;
    border: 1px solid #334155;
    color: var(--text);
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 15px;
    font-family: Consolas, Monaco, monospace;
    cursor: pointer;
    transition: .15s ease;
  }

  button:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  button.correct {
    border-color: var(--good);
    background: rgba(34,197,94,.12);
  }

  button.wrong {
    border-color: var(--bad);
    background: rgba(239,68,68,.10);
  }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    display: none;
    line-height: 1.55;
  }

  .feedback.show { display: block; }
  .feedback.ok { background: rgba(34,197,94,.12); border: 1px solid var(--good); }
  .feedback.err { background: rgba(239,68,68,.10); border: 1px solid var(--bad); }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .btn {
    width: auto;
    text-align: center;
    font-family: inherit;
    background: var(--accent);
    border: none;
    color: #04283d;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 10px;
    cursor: pointer;
  }

  .btn.secondary {
    background: transparent;
    border: 1px solid #475569;
    color: var(--text);
  }

  input {
    width: 100%;
    background: #0b1120;
    border: 1px solid #334155;
    color: var(--text);
    padding: 13px 14px;
    border-radius: 10px;
    font-family: Consolas, Monaco, monospace;
    font-size: 15px;
    margin-top: 10px;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .progress {
    height: 8px;
    background: #0b1120;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }

  .progress div {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
    transition: width .4s ease;
  }

  .hidden { display: none; }
  .final { text-align: center; }
  .final h1 { font-size: 34px; }

  .score {
    font-size: 40px;
    font-weight: 800;
    color: var(--accent);
    margin: 12px 0;
  }

  @media (max-width: 600px) {
    .card { padding: 18px; }
    h1 { font-size: 24px; }
    .code { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="game">
  <div class="topbar">
    <div class="badge">🐍 Мастер списков Python</div>
    <div class="badge" id="scoreBadge">Очки: 0</div>
  </div>

  <div class="progress"><div id="progressBar"></div></div>
  <div class="card" id="app"></div>
</div>

<script>
const app = document.getElementById("app");
const scoreBadge = document.getElementById("scoreBadge");
const progressBar = document.getElementById("progressBar");

let score = 0;
let step = 0;
const totalSteps = 11;

const steps = [
  {
    title: "История 1. Покупка автомобиля",
    text: "Мы решили приобрести новый автомобиль. В гараже уже имеются следующие автомобили. Мы приобрели автомобиль <b>'Aurus Senat'</b> и хотим добавить его в конец списка.",
    code: "garage = ['Lada Granta', 'Niva Travel', 'Lada Vesta', 'УАЗ Патриот']",
    list: ["Lada Granta", "Niva Travel", "Lada Vesta", "УАЗ Патриот"],
    question: "Какой метод следует использовать для добавления <b>'Aurus Senat'</b> в конец списка <code>garage</code>?",
    options: [
      {
        text: "garage.add('Aurus Senat')",
        correct: false,
        explain: "У списков Python отсутствует метод add(). Для добавления элемента в конец списка применяется метод append()."
      },
      {
        text: "garage.append('Aurus Senat')",
        correct: true,
        explain: "Верно. Метод append() добавляет элемент в конец списка."
      },
      {
        text: "garage.insert('Aurus Senat')",
        correct: false,
        explain: "Метод insert() требует указания двух аргументов: индекса и значения. Для добавления элемента в конец списка используется append()."
      }
    ],
    result: ["Lada Granta", "Niva Travel", "Lada Vesta", "УАЗ Патриот", "Aurus Senat"]
  },
  {
    title: "История 2. Отмена заказа",
    text: "В личном кабинете автосалона отображается список оформленных автомобилей. Необходимо отменить заказ на автомобиль <b>'УАЗ Патриот'</b>, зная его точное значение.",
    code: "my_cars = ['Lada Vesta', 'УАЗ Патриот', 'Aurus Senat']",
    list: ["Lada Vesta", "УАЗ Патриот", "Aurus Senat"],
    question: "Каким способом можно удалить данный элемент?",
    options: [
      {
        text: "del my_cars[1]",
        correct: true,
        explain: "Верно. Оператор del удаляет элемент по индексу."
      },
      {
        text: "my_cars.remove('УАЗ Патриот')",
        correct: true,
        explain: "Верно. Метод remove() удаляет первый элемент, значение которого совпадает с указанным."
      },
      {
        text: "my_cars.clear()",
        correct: false,
        explain: "Метод clear() удаляет все элементы списка, а не только один автомобиль."
      }
    ],
    result: ["Lada Vesta", "Aurus Senat"]
  },
  {
    title: "История 3. VIP-клиент салона красоты",
    text: "Мы являемся администраторами салона красоты. Клиентка Елена обратилась без предварительной записи, однако является VIP-клиентом. Необходимо добавить её на третью позицию, то есть на индекс 2.",
    code: "appointments = ['Анна', 'Петр', 'Мария', 'Олег']",
    list: ["Анна", "Петр", "Мария", "Олег"],
    question: "Какой код следует использовать для вставки <b>'Елена'</b> на индекс 2?",
    options: [
      {
        text: "appointments.append('Елена')",
        correct: false,
        explain: "Метод append() добавляет элемент в конец списка, а не на указанную позицию."
      },
      {
        text: "appointments.insert(2, 'Елена')",
        correct: true,
        explain: "Верно. Метод insert(2, 'Елена') вставляет элемент на индекс 2, при этом остальные элементы сдвигаются вправо."
      },
      {
        text: "appointments[2] = 'Елена'",
        correct: false,
        explain: "Данная запись заменяет элемент на индексе 2, а не вставляет новый элемент."
      }
    ],
    result: ["Анна", "Петр", "Елена", "Мария", "Олег"]
  },
  {
    title: "История 4. Проверка базы клиентов",
    text: "Перед звонком клиенту необходимо убедиться, что клиент с именем <b>'Павел'</b> присутствует в базе.",
    code: "clients = ['Павел', 'Петр', 'Анна']",
    list: ["Павел", "Петр", "Анна"],
    question: "Каким образом корректно проверить наличие элемента в списке?",
    options: [
      {
        text: "if 'Павел' == clients:",
        correct: false,
        explain: "Оператор == сравнивает строку со всем списком, а не проверяет наличие элемента внутри списка."
      },
      {
        text: "if 'Павел' in clients:",
        correct: true,
        explain: "Верно. Оператор in проверяет, содержится ли указанный элемент в списке."
      },
      {
        text: "if clients.find('Павел'):",
        correct: false,
        explain: "У списков отсутствует метод find(). Данный метод применяется к строкам."
      }
    ],
    result: ["Павел", "Петр", "Анна"]
  },
  {
    title: "История 5. Проверка наличия товара на складе",
    text: "Мы хотим заказать товар на Ozon. Перед добавлением товара в корзину необходимо убедиться, что он имеется в наличии.",
    code: "stock = ['Смартфон', 'Наушники', 'Пылесос', 'Чехол']",
    list: ["Смартфон", "Наушники", "Пылесос", "Чехол"],
    question: "Как проверить, что <b>'Пылесос'</b> содержится в списке товаров?",
    options: [
      {
        text: "if 'Пылесос' == stock:",
        correct: false,
        explain: "Оператор == сравнивает строку со всем списком, а не осуществляет поиск элемента внутри списка."
      },
      {
        text: "if 'Пылесос' in stock:",
        correct: true,
        explain: "Верно. Оператор in проверяет наличие элемента в списке."
      },
      {
        text: "if stock.find('Пылесос'):",
        correct: false,
        explain: "Метод find() применяется к строкам, но не к спискам."
      }
    ],
    result: ["Смартфон", "Наушники", "Пылесос", "Чехол"]
  },
  {
    title: "История 6. Добавление товара в корзину",
    text: "В корзину уже добавлены следующие товары. Мы нашли книгу и хотим добавить её в конец корзины.",
    code: "cart = ['Смартфон', 'Наушники', 'Чехол']",
    list: ["Смартфон", "Наушники", "Чехол"],
    question: "Какой код следует написать для добавления <b>'Книга'</b> в конец списка?",
    options: [
      {
        text: "cart.insert('Книга')",
        correct: false,
        explain: "Метод insert() требует указания двух аргументов: индекса и значения."
      },
      {
        text: "cart.append('Книга')",
        correct: true,
        explain: "Верно. Метод append() добавляет элемент в конец списка."
      },
      {
        text: "cart.add('Книга')",
        correct: false,
        explain: "У списков Python отсутствует метод add()."
      }
    ],
    result: ["Смартфон", "Наушники", "Чехол", "Книга"]
  },
  {
    title: "История 7. Удаление товара из корзины",
    text: "Мы передумали приобретать наушники. Данный товар находится под индексом 1.",
    code: "cart = ['Смартфон', 'Наушники', 'Чехол', 'Книга']",
    list: ["Смартфон", "Наушники", "Чехол", "Книга"],
    question: "Как удалить элемент по его индексу?",
    options: [
      {
        text: "del cart[1]",
        correct: true,
        explain: "Верно. Оператор del удаляет элемент по указанному индексу."
      },
      {
        text: "cart.remove(1)",
        correct: false,
        explain: "Метод remove() осуществляет поиск элемента по значению, а не по индексу."
      },
      {
        text: "cart.pop()",
        correct: false,
        explain: "Метод pop() без аргумента удаляет последний элемент списка."
      }
    ],
    result: ["Смартфон", "Чехол", "Книга"]
  },
  {
    title: "История 8. Очистка корзины",
    text: "Мы решили полностью очистить корзину, но сохранить саму переменную cart для дальнейшей работы.",
    code: "cart = ['Смартфон', 'Чехол', 'Книга']",
    list: ["Смартфон", "Чехол", "Книга"],
    question: "Какой метод следует использовать?",
    options: [
      {
        text: "cart.clear()",
        correct: true,
        explain: "Верно. Метод clear() удаляет все элементы списка, при этом сама переменная сохраняется как пустой список."
      },
      {
        text: "del cart",
        correct: false,
        explain: "Оператор del cart удаляет саму переменную, после чего обращение к ней становится невозможным."
      },
      {
        text: "cart.remove_all()",
        correct: false,
        explain: "Метода remove_all() у списков Python не существует."
      }
    ],
    result: []
  },
  {
    title: "История 9. Запись к врачу",
    text: "Мы записываемся к врачу. Необходимо добавить запись к хирургу на вторник, то есть на индекс 1.",
    code: "appointments = ['Терапевт (пн)', 'Стоматолог (ср)', 'Окулист (пт)']",
    list: ["Терапевт (пн)", "Стоматолог (ср)", "Окулист (пт)"],
    question: "Какой код следует написать?",
    options: [
      {
        text: "appointments.append('Хирург')",
        correct: false,
        explain: "Метод append() добавляет элемент в конец списка."
      },
      {
        text: "appointments.insert(1, 'Хирург')",
        correct: true,
        explain: "Верно. Метод insert(1, 'Хирург') вставляет элемент на индекс 1."
      },
      {
        text: "appointments[1] = 'Хирург'",
        correct: false,
        explain: "Данная запись заменяет существующий элемент, а не добавляет новый."
      }
    ],
    result: ["Терапевт (пн)", "Хирург", "Стоматолог (ср)", "Окулист (пт)"]
  },
  {
    title: "История 10. Перенос тренировки",
    text: "Мы записаны на тренировку по плаванию в среду, на индексе 1. Необходимо заменить эту тренировку на бокс, не добавляя новый элемент в список.",
    code: "schedule = ['Йога (пн)', 'Бассейн (ср)', 'Кроссфит (пт)']",
    list: ["Йога (пн)", "Бассейн (ср)", "Кроссфит (пт)"],
    question: "Какой код следует написать?",
    options: [
      {
        text: "schedule.append('Бокс')",
        correct: false,
        explain: "Метод append() добавляет новый элемент в конец списка."
      },
      {
        text: "schedule[1] = 'Бокс'",
        correct: true,
        explain: "Верно. Списки в Python являются изменяемыми структурами данных. Данная запись заменяет элемент по индексу."
      },
      {
        text: "schedule.insert(1, 'Бокс')",
        correct: false,
        explain: "Метод insert() вставляет элемент, но не заменяет существующий."
      }
    ],
    result: ["Йога (пн)", "Бокс", "Кроссфит (пт)"]
  },
  {
    title: "История 11. Создание надёжного пароля",
    text: "Мы регистрируемся в личном кабинете клиники. Система требует создать надёжный пароль. Пароль должен содержать символ <b>@</b> и заглавную букву <b>S</b>. Введите пароль и нажмите кнопку «Проверить».",
    input: true,
    placeholder: "Например: Secure@2026",
    check: value => {
      if (!value) {
        return { ok: false, message: "Введите пароль." };
      }

      const hasAt = value.includes("@");
      const hasS = value.includes("S");

      if (hasAt && hasS) {
        return {
          ok: true,
          message: "Пароль соответствует требованиям безопасности. В пароле присутствуют символ @ и заглавная буква S. Регистрация завершена."
        };
      }

      let message = "Пароль не соответствует требованиям безопасности. ";

      if (!hasAt) message += "В пароле отсутствует символ @. ";
      if (!hasS) message += "В пароле отсутствует заглавная буква S. ";

      message += "В Python проверка выполняется следующим образом: '@' in password and 'S' in password.";

      return { ok: false, message };
    }
  }
];

function render() {
  const currentStep = steps[step];

  progressBar.style.width = (step / totalSteps * 100) + "%";
  scoreBadge.textContent = "Очки: " + score;

  if (!currentStep) {
    return showFinal();
  }

  let html = `
    <h1>${currentStep.title}</h1>
    <p>${currentStep.text}</p>
  `;

  if (currentStep.code) {
    html += `<div class="code">${currentStep.code}</div>`;
  }

  if (currentStep.list) {
    html += `<div class="list">` + currentStep.list.map((item, index) => {
      return `<div class="item"><span>${index}</span>${item}</div>`;
    }).join("") + `</div>`;
  }

  if (currentStep.question) {
    html += `
      <p><b>Задание:</b> ${currentStep.question}</p>
      <div class="answers">
        ${currentStep.options.map((option, index) => {
          return `<button data-i="${index}">${option.text}</button>`;
        }).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions hidden" id="actions">
        <button class="btn" id="next">Продолжить →</button>
      </div>
    `;
  }

  if (currentStep.input) {
    html += `
      <input id="password" type="text" placeholder="${currentStep.placeholder}" autocomplete="off">
      <div class="actions">
        <button class="btn" id="check">Проверить пароль</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions hidden" id="actions">
        <button class="btn" id="next">Перейти к финалу →</button>
      </div>
    `;
  }

  app.innerHTML = html;

  if (currentStep.options) {
    app.querySelectorAll("button[data-i]").forEach(button => {
      button.addEventListener("click", () => {
        answer(Number(button.dataset.i));
      });
    });
  }

  if (currentStep.input) {
    const passwordInput = document.getElementById("password");
    const feedback = document.getElementById("feedback");
    const actions = document.getElementById("actions");

    document.getElementById("check").addEventListener("click", () => {
      const result = currentStep.check(passwordInput.value.trim());

      feedback.className = "feedback show " + (result.ok ? "ok" : "err");
      feedback.innerHTML = (result.ok ? "✅ " : "❌ ") + result.message;

      if (result.ok) {
        score += 10;
        scoreBadge.textContent = "Очки: " + score;
        actions.classList.remove("hidden");

        document.getElementById("next").addEventListener("click", () => {
          step++;
          render();
        });
      }
    });

    passwordInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        document.getElementById("check").click();
      }
    });
  }
}

function answer(index) {
  const currentStep = steps[step];
  const selectedOption = currentStep.options[index];
  const feedback = document.getElementById("feedback");
  const actions = document.getElementById("actions");

  app.querySelectorAll("button[data-i]").forEach((button, i) => {
    button.disabled = true;

    if (currentStep.options[i].correct) {
      button.classList.add("correct");
    }

    if (i === index && !selectedOption.correct) {
      button.classList.add("wrong");
    }
  });

  if (selectedOption.correct) {
    score += 10;
    scoreBadge.textContent = "Очки: " + score;

    feedback.className = "feedback show ok";
    feedback.innerHTML = "✅ " + selectedOption.explain;

    actions.classList.remove("hidden");

    document.getElementById("next").addEventListener("click", () => {
      step++;
      render();
    });
  } else {
    feedback.className = "feedback show err";
    feedback.innerHTML = "❌ " + selectedOption.explain;

    actions.classList.remove("hidden");

    const retryButton = document.createElement("button");
    retryButton.className = "btn secondary";
    retryButton.textContent = "Попробовать снова";
    retryButton.addEventListener("click", render);

    actions.appendChild(retryButton);
  }
}

function showFinal() {
  progressBar.style.width = "100%";

  const percent = Math.round(score / (totalSteps * 10) * 100);

  app.innerHTML = `
    <div class="final">
      <h1>🎉 Квест успешно завершён!</h1>
      <div class="score">${score} / ${totalSteps * 10}</div>
      <p>В ходе выполнения заданий мы освоили основные операции со списками в Python:</p>
      <div class="code">
append() — добавление элемента в конец списка  
insert(index, value) — вставка элемента на определённую позицию  
remove(value) — удаление элемента по значению  
del list[index] — удаление элемента по индексу  
pop() — удаление последнего элемента  
clear() — очистка списка  
in — проверка наличия элемента  
list[index] = value — замена элемента по индексу
      </div>
      <p class="muted">Ваш результат: ${percent}% правильных ответов.</p>
      <div class="actions" style="justify-content:center">
        <button class="btn" onclick="restart()">Пройти квест снова</button>
      </div>
    </div>
  `;
}

function restart() {
  score = 0;
  step = 0;
  render();
}

render();
</script>

</body>
</html>
